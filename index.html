    s(x, y, c) { if (x >= 0 && x < w && y >= 0 && y < ROWS) gr[y][x] = c; return o; },
    f(x1, y1, x2, y2, c) { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) o.s(x, y, c); return o; },
    gr(x1, x2) { return o.f(x1, 12, x2, 13, '#'); },
    r(x1, x2, y, c) { return o.f(x1, y, x2, y, c); },
    it(xs, y, c) { xs.forEach(x => o.s(x, y, c)); return o; },
  };

}

function newPlayer(x, y) { return { x, y, py: y, w: 10, h: 15, vx: 0, vy: 0, dir: 1, onGround: false, coyote: 0, jbuf: 0, hp: 3, inv: 0, anim: 0, dead: false, big: false, grow: 0, cool: 0 }; }
function mkBoss(x, y) { return { x, y, sxp: x, syp: y, w: 20, h: 28, vx: 0, vy: 0, dir: -1, hp: 12, maxhp: 12, st: 'idle', t: 0, inv: 0, active: false, say: '', sayT: 0, onGround: false }; }

function loadLevel(i) {
  const def = LEVELS[i], b = Bld(def.w); def.build(b);
  lvl = { def, th: THEMES[def.theme], w: def.w, grid: b.g };
  ents = []; squares = []; shots = []; stools = []; parts = []; pops = []; boss = null; dlg = null; flag = null;
  let px = 32, py = 160;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < def.w; x++) {
    const c = lvl.grid[y][x], bx = x * T, by = (y + 1) * T;
    if ('PcTefCEB'.includes(c)) lvl.grid[y][x] = ' ';
    switch (c) {
      case 'P': px = bx + 3; py = by - 15; break;
      case 'c': ents.push({ type: 'chek', x: bx + 4, y: by - 13, w: 7, h: 12, t: x * 7 }); break;
      case 'T': ents.push({ type: 'tumba', x: bx + 1, y: by - 14, w: 14, h: 14 }); break;
      case 'e': ents.push({ type: 'walker', x: bx + 2, y: by - 14, w: 12, h: 14, vx: 0, vy: 0, dir: -1, dead: 0, t: 0 }); break;
      case 'f': ents.push({ type: 'flyer', x0: bx + 2, y0: by - 10, x: bx + 2, y: by - 10, w: 12, h: 10, t: x * 13, dir: 1, dead: 0 }); break;
      case 'C': ents.push({ type: 'check', x: bx + 4, y: by - 32, w: 8, h: 32, on: false }); break;
      case 'E': flag = { type: 'exit', x: bx + 6, y: by - 144, w: 4, h: 144, ground: by, fy: by - 136 }; ents.push(flag); break;
      case 'B': boss = mkBoss(bx - 2, by - 28); break;
    }
  }
  
  if (def.turbo) {
    let x = 200;
    let track = 1;
    let gap_h = 90;
    let interval = 140;
    
    while (x < 2800) {
      if (x > 500 && track === 1) { track = 2; gap_h = 75; interval = 110; }
      if (x > 1000 && track === 2) { track = 3; gap_h = 60; interval = 90; }
      if (x > 1600 && track === 3) { track = 4; gap_h = 50; interval = 75; }
      if (x > 2200 && track === 4) { track = 5; gap_h = 45; interval = 60; }
      
      const gap_y = 30 + Math.random() * (H - 60 - gap_h);
      ents.push({

        x: x,
        gap_y: gap_y,
        gap_h: gap_h,
        track: track,
        w: 32,
        h: H
      });
      x += interval;
    }
    ents.push({
      type: 'turbo_bp',
      x: 3000,
      y: H / 2 - 40,
      w: 80,
      h: 80,
      t: 0

  levelStartScore = score;
}
function startLevel(i) { levelIdx = i; loadLevel(i); state = 'intro'; stT = 0; SND.play(null); }

// ---------------- ФИЗИКА ----------------
function moveBody(b) {
  b.onGround = false; b.hitWall = 0; b.hitHead = null;
  b.x += b.vx;
  let x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  let y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) { for (let y = y0; y <= y1; y++) if (isSolid(tileAt(x1, y))) { b.x = x1 * T - b.w; b.vx = 0; b.hitWall = 1; break; } }
  else if (b.vx < 0) { for (let y = y0; y <= y1; y++) if (isSolid(tileAt(x0, y))) { b.x = (x0 + 1) * T; b.vx = 0; b.hitWall = -1; break; } }
  const prevBottom = b.y + b.h;
  b.y += b.vy;
  x0 = Math.floor(b.x / T); x1 = Math.floor((b.x + b.w - 0.01) / T);
  y0 = Math.floor(b.y / T); y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vy > 0) {
    for (let x = x0; x <= x1; x++) {
      const c = tileAt(x, y1);
      if (isSolid(c) || (ONEWAY.has(c) && prevBottom <= y1 * T + 0.01)) { b.y = y1 * T - b.h; b.vy = 0; b.onGround = true; break; }
    }
  } else if (b.vy < 0) {
    const cx = Math.floor((b.x + b.w / 2) / T);
    let hit = null;
    if (isSolid(tileAt(cx, y0))) hit = cx; else for (let x = x0; x <= x1; x++) if (isSolid(tileAt(x, y0))) { hit = x; break; }
    if (hit !== null) { b.y = (y0 + 1) * T; b.vy = 0; b.hitHead = { x: hit, y: y0 }; }
  }
}

// ---------------- ЭФФЕКТЫ ----------------
function pop(x, y, text, col = '#fff', size = 5) { pops.push({ x, y, text, col, size, t: 0 }); }
function burst(x, y, cols, n = 8, sp = 2) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = Math.random() * sp + 0.5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, t: 0, life: 25 + Math.random() * 15, col: cols[i % cols.length], s: 2 }); }
}
function rainSquares(n) {
  const lo = cam + (lvl.def.boss ? 22 : 8), hi = cam + W - (lvl.def.boss ? 30 : 16);
  for (let i = 0; i < n; i++)
    squares.push({ x: clamp(P.x + (Math.random() - 0.5) * 100, lo, hi), y: -12 - Math.random() * 40 - i * 8, w: 7, h: 7, vx: (Math.random() - 0.5) * 0.8, vy: 0, t: 0, mag: false });
}

// ---------------- ИГРОК ----------------
function setBig(on) {
  if (P.big === on) return;
  const bottom = P.y + P.h, cx = P.x + P.w / 2;
  P.big = on; P.w = on ? 14 : 10; P.h = on ? 30 : 15; P.x = cx - P.w / 2; P.y = bottom - P.h; P.grow = 40;
}
function hurt() {
  if (P.inv > 0 || P.dead) return;
  if (P.big) { setBig(false); P.inv = 100; shake = 4; SND.sfx('shrink'); pop(P.x - 10, P.y - 8, 'ДЖИН ВЫВЕТРИЛСЯ', '#c8f5d0', 4); return; }
  P.hp--; P.inv = 100; P.vy = -4; P.vx = -P.dir * 2.5; shake = 6; SND.sfx('hurt');
  burst(P.x + 5, P.y + 7, ['#ff5050', '#fff'], 8);
  if (P.hp <= 0) killPlayer();
}
function killPlayer() { if (P.dead) return; P.dead = true; P.vy = -6; P.vx = 0; state = 'dying'; stT = 0; SND.play(null); SND.sfx('die'); }
function respawn() {
  if (lvl && lvl.def.turbo) {
    loadLevel(levelIdx);
    state = 'play';
    stT = 0;
    SND.play(lvl.def.music);
    return;
  }
  P = newPlayer(spawn.x, spawn.y); P.inv = 60; shots = []; stools = [];
  if (boss) { const b = mkBoss(boss.sxp, boss.syp); b.active = true; b.st = 'walk'; boss = b; lvl.grid[8][12] = 'G'; }
  cam = clamp(P.x - W / 2, 0, lvl.w * T - W);
  state = 'play'; stT = 0; SND.play(lvl.def.music);
}
function updPlayer() {
  if (lvl && lvl.def.turbo) {
    P.x = cam + 60;
    let accel = 0.6;
    if (keys.ArrowUp) P.vy -= accel;
    if (keys.ArrowDown) P.vy += accel;
    P.vy *= 0.92;
    P.y += P.vy;
    if (P.y < 10) { P.y = 10; P.vy = 0; }
    if (P.y > H - P.h - 10) { P.y = H - P.h - 10; P.vy = 0; }
    P.dir = 1;
    P.anim += 2;
    
    let speed = 2.5;
    if (cam > 500) speed = 3.5;
    if (cam > 1000) speed = 4.5;
    if (cam > 1600) speed = 5.5;
    if (cam > 2200) speed = 7.0;
    
    cam += speed;
    cam = Math.min(cam, lvl.w * T - W);
    
    if (P.inv > 0) P.inv--;
    return;
  }

  let ax = 0; if (keys.ArrowLeft) ax -= 1; if (keys.ArrowRight) ax += 1;
  if (ax) { P.vx += ax * (P.onGround ? 0.3 : 0.2); P.dir = ax; }
  else { P.vx *= P.onGround ? 0.72 : 0.95; if (Math.abs(P.vx) < 0.05) P.vx = 0; }
  P.vx = clamp(P.vx, -2.2, 2.2);
  if (jumpPressed()) P.jbuf = 7; else if (P.jbuf > 0) P.jbuf--;
  if (P.onGround) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (P.jbuf > 0 && P.coyote > 0) {
    P.vy = -7.2; P.jbuf = 0; P.coyote = 0; SND.sfx('jump');
    burst(P.x + P.w / 2, P.y + P.h, ['#ccc', '#999'], 4, 0.8);
  }
  if (!jumpKey() && P.vy < -2.5) P.vy = -2.5;
  P.vy = Math.min(P.vy + 0.36, 7);
  P.py = P.y;
  moveBody(P);
  P.anim += Math.abs(P.vx);
  if (P.inv > 0) P.inv--;
  if (P.grow > 0) P.grow--;
  if (P.cool > 0) P.cool--;
  if (pressed.KeyF && P.cool === 0 && stools.length < 2) {
    P.cool = 22; SND.sfx('throw');
    stools.push({ x: P.x + P.w / 2 - 5 + P.dir * 6, y: P.y + (P.big ? 8 : 2), w: 10, h: 10, vx: P.dir * 3.6 + P.vx * 0.4, vy: -2.8, t: 0, b: 0 });
  }
  if (P.hitHead) {
    const { x: tx, y: ty } = P.hitHead, c = lvl.grid[ty][tx];
    if (c === '?') {
      lvl.grid[ty][tx] = 'X';
      ents.push({ type: 'pop', x: tx * T + 4, y: ty * T - 12, vy: -3, t: 0 });
      stats.chek++; SND.sfx('coin'); rainSquares(1); pop(tx * T - 6, ty * T - 16, 'ЧЕКУШКА!', '#9fe0ff');
    } else if (c === 'G') {
      lvl.grid[ty][tx] = 'X'; SND.sfx('coin');
      ents.push({ type: 'gin', x: tx * T + 4, y: ty * T + 4, w: 7, h: 12, vx: 0, vy: 0, dir: 1, t: 0 });
    } else if (c === '=' && P.big) {
      lvl.grid[ty][tx] = ' '; SND.sfx('break'); shake = 3;
      for (let k = 0; k < 4; k++) parts.push({ x: tx * T + 4 + (k % 2) * 8, y: ty * T + 4 + (k >> 1) * 8, vx: (k % 2 ? 1.5 : -1.5), vy: -5 + (k >> 1) * 1.5, t: 0, life: 60, col: lvl.th.br[0], s: 5 });
    } else SND.sfx('bump');
  }
  const tx0 = Math.floor(P.x / T), tx1 = Math.floor((P.x + P.w - 1) / T), ty = Math.floor((P.y + P.h - 1) / T);
  for (let tx = tx0; tx <= tx1; tx++)
    if (tileAt(tx, ty) === '^' && P.y + P.h > ty * T + 8 && P.inv === 0) { hurt(); if (!P.dead) P.vy = -6; }
  if (P.y > H + 16) { P.hp = 0; killPlayer(); }
}
function killEnemy(e, msg) {
  e.dead = 1; rainSquares(1);
  burst(e.x + e.w / 2, e.y + e.h / 2, ['#fff', '#ffd23f', '#aaa'], 10);
  pop(e.x - 10, e.y - 8, msg || (e.type === 'walker' ? 'ОХРАННИК ОТДЫХАЕТ' : 'КУРЛЫ!'), '#fff', 4);
}
function enemyContact(e) {
  if (P.dead || !overlap(P, e)) return;
  if (P.vy > 0 && P.py + P.h <= e.y + 6) { P.vy = jumpKey() ? -7 : -4.5; SND.sfx('stomp'); killEnemy(e); }
  else hurt();
}

// ---------------- БОСС ----------------
function bossSay(list) {
  boss.say = list[Math.random() * list.length | 0];
  boss.sayT = 360;
}
function damageBoss() {
  const b = boss, toP = Math.sign(P.x - b.x) || 1;
  b.hp--; b.inv = 45; b.t = 0; shake = 6; SND.sfx('boss'); rainSquares(2);
  burst(b.x + b.w / 2, b.y + 6, ['#ffd23f', '#fff', '#7fd83a'], 12);
  b.vx = -toP * 2;
  if (b.hp <= 0) {
    b.st = 'dead';
    b.say = 'игроки хуевы... у меня не настроено... вас режут долбоебы...';
    b.sayT = 360;
    rainSquares(10); SND.play(null); SND.sfx('win'); shots = [];
  }
  else if (b.hp === b.maxhp / 2) {
    b.st = 'hurt';
    b.say = 'нехуй тут улыбаться и пиздеть! Теперь серьёзно!';
    b.sayT = 360;
  }
  else { b.st = 'hurt'; bossSay(BP_OUCH); }
}
function updBoss() {
  const b = boss; b.t++; if (b.inv > 0) b.inv--; if (b.sayT > 0) b.sayT--;
  if (!b.active) { b.vy = Math.min(b.vy + 0.36, 8); b.vx = 0; moveBody(b); return; }
  const phase2 = b.hp <= b.maxhp / 2;
  const pc = P.x + P.w / 2, bc = b.x + b.w / 2, toP = Math.sign(pc - bc) || 1, dist = Math.abs(pc - bc);
  switch (b.st) {
    case 'walk':
      b.dir = toP; b.vx = b.dir * (phase2 ? 1.1 : 0.7);
      if (!b._tauntTimer) b._tauntTimer = 180 + Math.random() * 120 | 0;
      if (--b._tauntTimer <= 0 && b.sayT === 0) {
        bossSay(BP_TAUNT);
        b._tauntTimer = 240 + Math.random() * 180 | 0;
      }
      if (b.t > (phase2 ? 70 : 100)) {
        const r = Math.random(); b.t = 0;
        b.st = phase2 ? (r < 0.35 ? 'charge' : r < 0.7 ? 'throw' : 'jump') : (r < 0.55 ? 'throw' : 'jump');
        if (b.st === 'jump') { b.vy = -7.5; b.vx = toP * Math.min(2.2, dist / 50); }
        if (b.st === 'throw' && Math.random() < 0.6) bossSay(BP_TAUNT);
        if (b.st === 'charge') { b.say = 'БП ИДЁТ!'; b.sayT = 180; }
      }
      break;
    case 'throw':
      b.vx = 0; b.dir = toP;
      if (b.t === 22) {
        const n = phase2 ? 3 : 1;
        for (let k = 0; k < n; k++) {
          const vx = b.dir * (clamp(dist / 62, 0.8, 3.2) + (k - (n - 1) / 2) * 0.7);
          shots.push({ type: 'snot', x: b.x + (b.dir > 0 ? 16 : 0), y: b.y + 5, w: 8, h: 7, vx, vy: -4.2, t: 0 });
        }
        SND.sfx('spit');
      }
      if (b.t > 55) { b.st = 'walk'; b.t = 0; }
      break;
    case 'jump':
      if (b.onGround && b.t > 5) {
        shake = 10; SND.sfx('land'); b.st = 'walk'; b.t = 0; b.vx = 0;
        burst(bc, b.y + b.h, ['#caa', '#866'], 10, 1.5);
        if (phase2 && b.y + b.h >= 190) {
          shots.push({ type: 'wave', x: b.x - 10, y: b.y + b.h - 8, w: 10, h: 8, vx: -2.4, t: 0 });
          shots.push({ type: 'wave', x: b.x + b.w, y: b.y + b.h - 8, w: 10, h: 8, vx: 2.4, t: 0 });
        }
      }
      break;
    case 'charge':
      if (b.t < 35) { b.vx = 0; b.dir = toP; }
      else if (b.t % 4 === 0) burst(b.x + (b.dir > 0 ? 0 : b.w), b.y + b.h, ['#aaa'], 1, 0.5);
      break;
    case 'stun': b.vx *= 0.9; if (b.t > 80) { b.st = 'walk'; b.t = 0; } break;
    case 'hurt': b.vx *= 0.9; if (b.t > 30) { b.st = 'walk'; b.t = 0; } break;
    case 'dead':
      b.vx *= 0.9;
      if (b.t === 120) startDlg(BOSS_END, () => { state = 'win'; stT = 0; SND.play('win'); });
      break;
  }
  b.vy = Math.min(b.vy + 0.36, 8);
  if (b.st === 'charge' && b.t >= 35) b.vx = b.dir * 3.6;
  moveBody(b);
  if (b.st === 'charge' && b.t >= 35 && (b.hitWall || b.t > 170)) {
    b.st = 'stun'; b.t = 0; shake = 12; SND.sfx('land'); b.vy = -3; b.vx = -b.dir * 1.2; b.say = 'Ой, стена...'; b.sayT = 180;
  }
  if (!P.dead && b.st !== 'dead' && overlap(P, b)) {
    if (P.vy > 0 && P.py + P.h <= b.y + 10) { P.vy = -6.5; if (b.inv === 0) damageBoss(); }
    else hurt();
  }
}

// ---------------- ДИАЛОГИ ----------------
function startDlg(lines, onEnd) { dlg = { lines: lines.map(l => ({ who: l.who, t: l.t.replace('{S}', score) })), i: 0, ch: 0, onEnd }; }
function updDlg() {
  const L = dlg.lines[dlg.i]; dlg.ch += 0.8;
  if (okPressed()) {
    if (dlg.ch < L.t.length) dlg.ch = L.t.length;
    else { dlg.i++; dlg.ch = 0; SND.sfx('blip'); if (dlg.i >= dlg.lines.length) { const f = dlg.onEnd; dlg = null; f && f(); } }
  }
}

// ---------------- ОБНОВЛЕНИЕ ----------------
function updSquares() {
  for (const s of squares) {
    s.t++;
    if (s.t > 200 || s.mag || state === 'clear') {
      s.mag = true;
      const dx = P.x + P.w / 2 - (s.x + 3), dy = P.y + P.h / 2 - (s.y + 3), d = Math.hypot(dx, dy) || 1, sp = Math.min(6, 1.5 + s.t * 0.02);
      s.x += dx / d * sp; s.y += dy / d * sp;
    } else {

function update() {
  frameCount++; stT++;
  switch (state) {
    case 'title':
      titleCam += 0.6;
      if (frameCount % 12 === 0) deco.push({ x: Math.random() * W, y: -10, vy: 0.5 + Math.random() });
      for (const d of deco) d.y += d.vy; deco = deco.filter(d => d.y < 200);
      SND.play('title');
      if (okPressed()) { state = 'story'; storyI = 0; storyCh = 0; stT = 0; SND.sfx('blip'); }
      break;
    case 'story':
      storyCh += 0.8;
      if (frameCount % 10 === 0) deco.push({ x: Math.random() * W, y: -10, vy: 0.5 + Math.random() });
      for (const d of deco) d.y += d.vy; deco = deco.filter(d => d.y < 110);
      if (pressed.Escape) newGame();
      else if (okPressed()) {
        if (storyCh < STORY[storyI].text.length) storyCh = 999;
        else { storyI++; storyCh = 0; SND.sfx('blip'); if (storyI >= STORY.length) newGame(); }
      }
      break;
    case 'intro':
      if (stT > 170 || (stT > 30 && okPressed())) {
        state = 'play'; stT = 0;
        if (lvl.def.boss) { SND.play(null); startDlg(BOSS_INTRO, () => { boss.active = true; boss.st = 'walk'; boss.t = 0; SND.play('boss'); }); }
        else SND.play(lvl.def.music);
      }
      break;
    case 'play': updPlay(); break;
    case 'pause': if (pressed.Escape || pressed.KeyP) state = pauseFrom || 'play'; break;
    case 'dying':
      P.vy += 0.3; P.y += P.vy; updFx();
      if (stT > 110) { lives--; if (lives <= 0) { state = 'gameover'; stT = 0; } else respawn(); }
      break;
    case 'clear': updClear(); break;
    case 'gameover':
      if (stT > 60 && okPressed()) { lives = 3; score = levelStartScore; startLevel(levelIdx); }
      break;
    case 'win':
      if (frameCount % 6 === 0) deco.push({ x: Math.random() * W, y: -10, vy: 0.6 + Math.random() * 1.2 });
      for (const d of deco) d.y += d.vy; deco = deco.filter(d => d.y < 200);
      if (stT > 120 && okPressed()) { state = 'title'; stT = 0; deco = []; }
      break;
  }
  if (pressed.KeyM) SND.musicOn = !SND.musicOn;

}

  } else if (p === 'keys') {
    const key = (x, y, w, l) => { g.fillStyle = '#555'; g.fillRect(x, y + 2, w, 16); g.fillStyle = '#ddd'; g.fillRect(x, y, w, 15); g.fillStyle = '#fff'; g.fillRect(x, y, w, 1); labels.push({ x: x + w / 2, y: y + 5, t: l, size: 5, col: '#222', sh: false }); };
    key(cx - 84, 40, 18, '←'); key(cx - 62, 40, 18, '→'); key(cx - 34, 40, 70, 'ПРОБЕЛ'); key(cx + 46, 40, 18, 'F');
    drawSprScaled(g, SPR.pj, cx - 6, 64 - Math.abs(Math.sin(frameCount * 0.08)) * 8, 1.5);
    drawStool(g, cx + 30 + (frameCount % 60), 74, (frameCount >> 2) % 4);
  }
}
let labels = [];
function bubble(x, y, text) {
  const size = 4.5; sx.font = `${Math.round(size * S)}px ${FONT}`;
  const w = sx.measureText(text).width / S + 8, h = size + 7;
  const bx = clamp(x - w / 2, 2, W - w - 2), by = Math.max(16, y - h);
  sx.fillStyle = '#000'; sx.fillRect((bx - 1) * S, (by - 1) * S, (w + 2) * S, (h + 2) * S);
  sx.fillStyle = '#fff'; sx.fillRect(bx * S, by * S, w * S, h * S);
  sx.fillRect((x - 2) * S, (by + h) * S, 4 * S, 3 * S);
  txt(text, bx + 4, by + 4, size, '#111', 'left', null);
}
function renderDlgHi() {
  const L = dlg.lines[dlg.i], bx = 8, by = H - 68, bw = W - 16, bh = 60;
  sx.fillStyle = 'rgba(8,8,24,0.94)'; sx.fillRect(bx * S, by * S, bw * S, bh * S);
  sx.strokeStyle = '#fff'; sx.lineWidth = Math.max(1, S); sx.strokeRect((bx + 1.5) * S, (by + 1.5) * S, (bw - 3) * S, (bh - 3) * S);
  const por = L.who === 'БП' ? PORT.bp : PORT.il, ps = 40 / por.height;
  sx.fillStyle = '#20204a'; sx.fillRect((bx + 6) * S, (by + 8) * S, 36 * S, 44 * S);
  sx.drawImage(por, (bx + 24 - por.width * ps / 2) * S, (by + 10) * S, por.width * ps * S, por.height * ps * S);
  txt(L.who === 'БП' ? 'ДЕНИС «БП»' : 'ИЛЬДАР', bx + 50, by + 8, 6, L.who === 'БП' ? '#ff6070' : '#ffb040');
  const lines = wrap(L.t, bw - 60, 5.5); let left = Math.floor(dlg.ch);
  lines.forEach((ln, i) => { if (left <= 0) return; txt(ln.slice(0, left), bx + 50, by + 21 + i * 10, 5.5, '#fff'); left -= ln.length + 1; });
  if (dlg.ch >= L.t.length && (frameCount >> 4) % 2) txt('▼', bx + bw - 14, by + bh - 12, 5, '#ffd23f');
}
function fmtTime(f) { const s = Math.floor(f / 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function render() {
  labels = [];
  g.save();
  if (shake) g.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
  if (state === 'title') renderTitleLow();
  else if (state === 'story') renderStoryLow();
  else if (state === 'intro' || state === 'gameover') {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    if (state === 'intro') drawSprScaled(g, SPR.ps, W / 2 - 12, 120, 2);
  } else if (state === 'win') {
    drawBG(THEMES.boss, 0); groundStrip(THEMES.boss, 0);
    for (const d of deco) drawSq(g, Math.round(d.x), Math.round(d.y));
    drawSprScaled(g, [SPR.ps, SPR.pj][(frameCount >> 4) % 2], 150, 160, 2);
    drawBossAt(g, 210, 164, -1, frameCount, 'idle');
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(40, 20, W - 80, 118);
  } else if (lvl) renderWorld();
  g.restore();

  sx.imageSmoothingEnabled = false;
  sx.drawImage(buf, 0, 0, scr.width, scr.height);
  for (const l of labels) txt(l.t, l.x, l.y, l.size, l.col, 'center', l.sh === false ? null : '#000');

  const blink = (frameCount >> 5) % 2 === 0;
  switch (state) {
    case 'title':
      txt('ИЛЬДАР', W / 2, 30, 22, '#ff9a2a', 'center', '#5a1e00');
      txt('ТЕХНОЛОГ', W / 2, 60, 12, '#fff', 'center', '#223');
      txt('погоня за квадратными метрами', W / 2, 84, 5.5, '#b8ffb0', 'center');
      if (blink) txt('ЖМИ ПРОБЕЛ', W / 2, 118, 8, '#ffd23f', 'center');
      txt('← → бег  ПРОБЕЛ прыжок  F табуретка  M музыка  P пауза', W / 2, 212, 4.2, '#fff', 'center');
      break;
    case 'story': {
      const lines = wrap(STORY[storyI].text, W - 50, 6); let left = Math.floor(storyCh);
      lines.forEach((ln, i) => { if (left <= 0) return; txt(ln.slice(0, left), 25, 110 + i * 12, 6, '#fff'); left -= ln.length + 1; });
      txt(`${storyI + 1}/${STORY.length}`, 25, 208, 5, '#667');
      if (blink) txt('ПРОБЕЛ ▶', W - 25, 208, 5, '#ffd23f', 'right');
      txt('ESC — пропустить', W / 2, 208, 4.5, '#556', 'center');
      break;
    }
    case 'intro':
      txt(lvl.def.boss ? 'БОСС' : `УРОВЕНЬ ${levelIdx + 1}`, W / 2, 40, 8, '#aaa', 'center');
      txt(lvl.def.name, W / 2, 60, 12, lvl.def.boss ? '#ff5060' : '#ffb040', 'center');
      txt(lvl.def.sub, W / 2, 88, 5.5, '#9fe0a0', 'center');
      txt(`м²: ${score}     жизни: ×${lives}`, W / 2, 172, 6, '#fff', 'center');
      break;
    case 'play': case 'dying': case 'clear': case 'pause': {
      const c = Math.round(cam);
      txt(`×${lives}`, 34, 4, 6, '#fff');
      txt(`${score} м²`, 84, 4, 6, '#7f7');
      txt(`${stats.chek}`, 170, 4, 6, '#9fe0ff');
      txt(`${stats.tumba}`, 219, 4, 6, '#ffb040');
      txt('F', 257, 4, 6, '#ddd');
      txt(lvl.def.name, W - 4, 4, 5, '#ddd', 'right');
      for (const p of pops) txt(p.text, p.x - c, p.y, p.size, p.col, 'left');
      if (boss && boss.active && boss.st !== 'dead') txt('ДЕНИС «БП» КИЛЬПИКОВ', W / 2, H - 23, 5, '#ffb0b8', 'center');
      if (boss && boss.sayT > 0) bubble(boss.x - c + 10, boss.y - 8, boss.say);
      if (dlg) renderDlgHi();
      
      if (lvl && lvl.def.turbo) {
        const tracks = [
          { cam: 0, name: 'ТРАССА 1: РАЗГОН', col: '#7f7' },
          { cam: 500, name: 'ТРАССА 2: НАБОР', col: '#9fe0ff' },
          { cam: 1000, name: 'ТРАССА 3: СКОРОСТЬ', col: '#ffb040' },
          { cam: 1600, name: 'ТРАССА 4: ЭКСТРИМ', col: '#ff9090' },
          { cam: 2200, name: 'ТРАССА 5: БП ВПЕРЕДИ!', col: '#ff5050' },
        ];
        for (const tr of tracks) {
          if (cam >= tr.cam && cam - tr.cam < 150) {
            const alpha = 1 - (cam - tr.cam) / 150;
            sx.globalAlpha = alpha;
            txt(tr.name, W / 2, H / 2 - 20, 10, tr.col, 'center', '#000');
            sx.globalAlpha = 1;
          }
        }
      }

      if (state === 'clear' && stT > 40) {
        txt(`${lvl.def.name}: ПРОЙДЕНО!`, W / 2, 70, 8, '#ffd23f', 'center');
        txt(`всего квадратов: ${score} м²`, W / 2, 90, 6, '#7f7', 'center');
      }
      if (state === 'pause') { sx.fillStyle = 'rgba(0,0,0,0.5)'; sx.fillRect(0, 0, scr.width, scr.height); txt('ПАУЗА', W / 2, 100, 12, '#fff', 'center'); }
      break;
    }
    case 'gameover':
      txt('АКТ НЕ ПОДПИСАН', W / 2, 80, 10, '#ff4050', 'center');
      txt('Ильдар ушёл на больничный...', W / 2, 106, 5.5, '#aaa', 'center');
      if (stT > 60 && blink) txt('ПРОБЕЛ — ещё раз', W / 2, 150, 6, '#ffd23f', 'center');
      break;
    case 'win':
      txt('АКТ ПОДПИСАН!', W / 2, 28, 12, '#ffd23f', 'center', '#5a3a00');
      txt('Ильдар — технолог года', W / 2, 50, 6, '#fff', 'center');
      txt(`Квадратных метров: ${score} м²`, W / 2, 70, 6, '#7f7', 'center');
      txt(`Чекушек: ${stats.chek}    Тумбочек: ${stats.tumba}`, W / 2, 86, 5.5, '#9fe0ff', 'center');
      txt(`Время: ${fmtTime(stats.frames)}`, W / 2, 102, 5.5, '#ddd', 'center');
      if (stT > 120 && blink) txt('ПРОБЕЛ — в главное меню', W / 2, 120, 5.5, '#ffd23f', 'center');
      if ((frameCount >> 6) % 2) bubble(221, 158, 'Молодец, Ильдар! Апчхи!'); else bubble(162, 156, 'Будь здоров, БП!');
      break;
  }
}

// ---------------- ЦИКЛ ----------------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
